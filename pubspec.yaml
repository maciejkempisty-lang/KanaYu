name: kanayu
description: Spokojna wioska i pierwsze kroki w hiraganie.
publish_to: none
version: 0.2.0+3
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  rive: 0.14.11
  fsrs: 2.0.1
  drift: ^2.30.0
  drift_flutter: ^0.2.7
  uuid: ^4.5.2
  crypto: ^3.0.7
  unorm_dart: ^0.3.0
  path_drawing: ^1.0.1
  audioplayers: ^6.5.1
  share_plus: ^12.0.1
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/rive/
    - assets/content/
    - assets/audio/
    - assets/strokes/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: KleeOne
      fonts:
        - asset: assets/fonts/KleeOne-Regular.ttf
    - family: ZenMaru
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Regular.ttf

