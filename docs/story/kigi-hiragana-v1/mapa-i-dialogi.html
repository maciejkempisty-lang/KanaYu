&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

(() =&gt; {
  const root = document.getElementById(&#x27;kigi-map-story&#x27;);
  const data = {&quot;version&quot;: &quot;kigi-hiragana-map/1.1-draft&quot;, &quot;date&quot;: &quot;2026-11-08&quot;, &quot;title&quot;: &quot;Kigi — pierwsza Ścieżka Lampionów&quot;, &quot;status&quot;: &quot;Propozycja treści i statycznych grafik. Nie jest wdrożeniem w aplikacji.&quot;, &quot;source_story&quot;: &quot;docs/fabula-kigi.md&quot;, &quot;language_source&quot;: &quot;https://jpfbj.cn/irodori/resources/pdf/X_Hiragana_All.pdf&quot;, &quot;premise&quot;: &quot;Yuu po raz pierwszy przygotowuje Wieczór Lampionów. Notes poprzedniej opiekunki zawiera wspomnienia, lecz nie gotową instrukcję. Pomagając mieszkańcom, gracz poznaje hiraganę i tworzy własną stronę historii Kigi.&quot;, &quot;adaptation&quot;: [&quot;Zachowujemy Yuu, Minę, Tomę, notes poprzedniej opiekunki i motyw miejsca dla nowej osoby.&quot;, &quot;Neri, Hana i Sora są nowymi propozycjami, poszerzającymi obsadę o gospodarzy istniejących miejsc na przesłanej mapie.&quot;, &quot;Jedno rozpoczęte spotkanie edukacyjne dotyczy jednej grupy znaków. Ten sam NPC może prowadzić kilka kolejnych spotkań; kliknięcie postaci samo nie rozpoczyna próby.&quot;, &quot;Pierwszy etap obejmuje 46 podstawowych znaków w 10 spotkaniach. わ・を・ん to krótki blok końcowy, a nie trzy sylaby jednego regularnego rzędu.&quot;, &quot;W tej adaptacji Wieczór Lampionów kończy podstawowy etap po 46 znakach. W starszym zarysie następował dopiero po dakuten i handakuten; przesunięcie finału jest świadomą propozycją uproszczenia.&quot;, &quot;Dakuten, handakuten, małe ゃゅょ, małe っ, długość samogłosek i kontekst partykuł pozostają dalszymi lekcjami hiragany na tej samej mapie. Katakana dostaje później osobną mapę za górną bramą.&quot;, &quot;Mapa jest zadbana od początku. Widoczne już lampy, skrzynka, ławki i sprawny most pozostają na miejscu; postęp dodaje koperty, ozdoby i wpisy w notesie.&quot;, &quot;Aktualny lokalny katalog KanaYu zawiera 10 znaków hiragany. Nowe 36 znaków w tym pakiecie to zakres do opracowania w katalogu, z nagraniami i wzorcami pisania. Nie są już działającymi lekcjami.&quot;], &quot;map&quot;: {&quot;reference&quot;: &quot;map-reference.png&quot;, &quot;size&quot;: [1024, 1536], &quot;coordinates&quot;: &quot;Pozycje znormalizowane względem całego obrazu; początek w lewym górnym rogu. Anchor oznacza stopy. Pozycje są propozycją wizualną, nie pomiarem gotowej implementacji.&quot;, &quot;navigation&quot;: &quot;Dotknięcie mieszkańca otwiera rozmowę. Mapa może być oglądana swobodnie; jedynie kolejność nowych wyzwań jest ustalona. Bez obowiązkowego chodzenia awatarem.&quot;, &quot;display&quot;: &quot;Pełna mapa ma proporcje 2:3. Postacie i obszary dotyku muszą korzystać z tego samego skalowania i przesunięcia co tło.&quot;, &quot;gate&quot;: &quot;Górna brama: zapowiedź przyszłej mapy katakany, bez dodatkowego NPC w pierwszej dostawie.&quot;, &quot;finale_location&quot;: &quot;Polana z trzema ławkami w dolnej prawej części mapy.&quot;}, &quot;interaction&quot;: {&quot;loop&quot;: [&quot;Dotknij NPC-a&quot;, &quot;Przeczytaj 1–2 krótkie wypowiedzi&quot;, &quot;Wybierz rozpoczęcie&quot;, &quot;Poznaj znaki jednej grupy&quot;, &quot;Spróbuj odczytać każdy znak w zmienionej kolejności&quot;, &quot;Obejrzyj informację zwrotną&quot;, &quot;Zobacz krótkie zakończenie i pamiątkę&quot;, &quot;Wróć na mapę&quot;], &quot;lesson&quot;: &quot;3 lub 5 znaków. Poznawanie: znak, odczyt i odsłuch. Próba: sam znak i wpisanie odczytu albo Nie wiem jeszcze. Bez limitu czasu i progu bezbłędności.&quot;, &quot;completion&quot;: &quot;Wszystkie znaki grupy otrzymały pierwszą odpowiedź albo Nie wiem jeszcze, a użytkownik zobaczył odpowiedzi. Ukończenie spotkania nie oznacza utrwalenia.&quot;, &quot;mixed_review&quot;: &quot;Powtórki znanych grup dostępne osobno. Mieszanych powtórek nie dokładamy automatycznie do nowego spotkania.&quot;, &quot;words&quot;: &quot;Istniejące いいえ, ここ, いい można później udostępnić u Yuu jako osobne, dobrowolne ćwiczenie. Nie dokładamy ich do spotkania z jedną grupą znak ina&quot;, &quot;group&quot;: &quot;ざじずぜぞ&quot;, &quot;theme&quot;: &quot;Nowy plik pocztowych kart&quot;}, {&quot;npc&quot;: &quot;sora&quot;, &quot;group&quot;: &quot;だぢづでど&quot;, &quot;theme&quot;: &quot;Podobne brzmienia, różne zapisy&quot;}, {&quot;npc&quot;: &quot;neri&quot;, &quot;group&quot;: &quot;ばびぶべぼ&quot;, &quot;theme&quot;: &quot;Kolejny przystanek przy strumieniu&quot;}, {&quot;npc&quot;: &quot;hana&quot;, &quot;group&quot;: &quot;ぱぴぷぺぽ&quot;, &quot;theme&quot;: &quot;Okrągłe znaczki na szkolnych kartach&quot;}, {&quot;npc&quot;: &quot;yuu&quot;, &quot;group&quot;: &quot;Małe ゃゅょ, małe っ, długość samogłosek, odczyt partykuł&quot;, &quot;theme&quot;: &quot;Osobne małe lekcje przed deklarowaniem pełnego zakresu hiragany&quot;}], &quot;art_delivery&quot;: {&quot;type&quot;: &quot;Sześć oddzielnych, statycznych PNG z przezroczystością, jedna poza każdej postaci; pierwsza propozycja wizualna do oceny na mapie.&quot;, &quot;usage&quot;: &quot;Ta sama grafika może działać na mapie i przy panelu dialogowym. Tekst jest zawsze osobnym elementem interfejsu.&quot;, &quot;limitations&quot;: &quot;Brak animacji, rigów Rive, osobnych póz reakcji i wdrożenia w Flutterze. Nowy Yuu nie jest potwierdzonym odpowiednikiem istniejącej animacji Rive.&quot;, &quot;integration&quot;: &quot;Dopasować skalę i faktyczny punkt stóp każdego eksportu. Uwzględnić warstwy mostku, schodów i budynków. Nie umieszczać aktywnych NPC-ów za budynkami ani na wodzie.&quot;, &quot;future_poses&quot;: [&quot;neutralna&quot;, &quot;powitanie&quot;, &quot;wskazanie karty&quot;, &quot;życzliwe wsparcie&quot;, &quot;spokojna radość&quot;]}, &quot;dialogue_revision&quot;: {&quot;version&quot;: &quot;character-voices/1.0&quot;, &quot;date&quot;: &quot;2026-11-08&quot;, &quot;summary&quot;: &quot;Odrębne charaktery, rytm mowy i humor sześciu mieszkańców; nowe rozmowy, powroty, reakcje na odpowiedzi i finał.&quot;, &quot;guidelines&quot;: [&quot;Skojarzenia ze zwierzętami są inspiracją baśniową. Charak
